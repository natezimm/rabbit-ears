name: NASA Source Inspection

# Checks exact source renditions without putting video files in the repository,
# Docker image, artifacts, or the public demo. No rights approval is automated.
on:
  pull_request:
    paths:
      - scripts/inspect-nasa-sources.py
      - tests/test_inspect_nasa_sources.py
      - .github/workflows/nasa-source-inspection.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect-nasa-sources:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
      - name: Install FFmpeg
        run: |
          # The runner's apt mirror sometimes stalls; give up on a slow attempt and try again
          # rather than holding the job until its timeout.
          for attempt in 1 2 3; do
            sudo timeout 150 apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=20 update \
              && sudo timeout 240 apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=20 install -y ffmpeg \
              && exit 0
          done
          exit 1
      - name: Validate inspection script without internet
        run: python3 -m unittest discover -s tests -p 'test_inspect_nasa_sources.py'
      - name: Fetch, hash, probe and decode only two allowlisted NASA media files
        run: python3 scripts/inspect-nasa-sources.py --download --report nasa-source-inspection.json
      - name: Upload metadata-only technical inspection result
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nasa-source-inspection-metadata
          path: nasa-source-inspection.json
          if-no-files-found: warn
          retention-days: 7
