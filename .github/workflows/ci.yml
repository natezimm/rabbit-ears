name: CI

on:
  # Pull requests are tested, and main is tested again after each merge.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same pull request replaces its older run. Runs on main always finish.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Jobs are pinned to Ubuntu 24.04 rather than ubuntu-latest, which is moving to a newer image.
# Jobs that installed ffmpeg on it intermittently hung in apt, and wheelhouse found Playwright
# could not install Chromium there. Move the pin when both are known to work on the new image.
jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6
        with:
          global-json-file: global.json
      - run: dotnet test

  mac-desktop:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6
        with:
          global-json-file: global.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: brew install mpv ffmpeg
      - name: Record native dependency versions
        run: |
          uname -a
          mpv --version
          ffprobe -version
      - run: dotnet test
      - run: bash scripts/publish-mac.sh osx-arm64
      - run: python3 tests/smoke-mac.py publish/mac/osx-arm64
      # Tar preserves executable bits when downloaded from Actions.
      - run: tar -czf rabbit-ears-osx-arm64.tar.gz -C publish/mac osx-arm64
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: rabbit-ears-osx-arm64
          path: rabbit-ears-osx-arm64.tar.gz
          retention-days: 7

  windows-desktop:
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6
        with:
          global-json-file: global.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install native playback dependencies
        run: |
          choco install mpvio.install --version=0.41.0 --yes --no-progress
          if ($LASTEXITCODE -ne 0) { throw 'mpv install failed' }
          Join-Path $env:ChocolateyInstall 'lib/mpvio.install/tools' | Out-File $env:GITHUB_PATH -Append -Encoding utf8
          choco install ffmpeg --yes --no-progress
          if ($LASTEXITCODE -ne 0) { throw 'FFmpeg install failed' }
      - name: Record native versions
        run: |
          mpv --version
          ffprobe -version
          dotnet --info
      - run: dotnet test
      - run: ./scripts/publish-windows.ps1 win-x64
      - run: ./tests/smoke-windows.ps1 -Package publish/windows/win-x64
      # ARM64 is a build artifact for Parallels testing, not a claim of native validation.
      - run: ./scripts/publish-windows.ps1 win-arm64
      - name: Archive packages and checksums
        run: |
          Compress-Archive publish/windows/win-x64 rabbit-ears-win-x64.zip
          Compress-Archive publish/windows/win-arm64 rabbit-ears-win-arm64.zip
          Get-FileHash rabbit-ears-win-*.zip -Algorithm SHA256 | Format-Table -AutoSize | Out-File SHA256SUMS.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: rabbit-ears-windows
          path: |
            rabbit-ears-win-*.zip
            SHA256SUMS.txt
          retention-days: 7

  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6
        with:
          global-json-file: global.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - uses: ./.github/actions/install-ffmpeg
      # The browser download is cached per Playwright version; its system libraries are not.
      - name: Playwright version
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - run: npm run test:browser
      - name: Browser report, screenshots, traces and application logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: browser-test-results
          path: |
            web/playwright-report/
            web/test-results/
          retention-days: 7

  media-preparation:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/install-ffmpeg
      - run: python3 -m unittest discover -s tests -p 'test_*.py'

  # The demo site's container, built the way the server builds it.
  demo-image:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      # The layer cache spares the npm install, .NET publish and generated clips when their
      # inputs have not changed.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          load: true
          tags: rabbit-ears
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: ./.github/actions/install-ffmpeg
      - name: The container answers and opens on the demo page
        run: |
          docker run -d --name demo -p 8080:8080 rabbit-ears
          for i in $(seq 30); do curl -fs http://localhost:8080/api/health && break; sleep 1; done
          curl -fs http://localhost:8080/api/demo | grep -q '"enabled":true'
          test "$(curl -fs http://localhost:8080/health | jq -r .checks.library)" = Healthy
          test "$(curl -fs http://localhost:8080/api/library | jq .episodes)" -gt 0
          curl -s -o /dev/null -w '%{redirect_url}' http://localhost:8080/ | grep -q /demo
      - name: Verify generated fallback release
        run: python3 scripts/verify-demo-release.py --base-url http://127.0.0.1:8080
      - name: Verify read-only approved media mount and byte ranges
        run: bash tests/smoke-prepared-demo.sh
