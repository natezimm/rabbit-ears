name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet test

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - name: Browser report, screenshots, traces and application logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-results
          path: |
            web/playwright-report/
            web/test-results/
          retention-days: 7

  media-preparation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: python3 -m unittest discover -s tests -p 'test_*.py'

  # The demo site's container, built the way the server builds it.
  demo-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t rabbit-ears .
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: The container answers and opens on the demo page
        run: |
          docker run -d --name demo -p 8080:8080 rabbit-ears
          for i in $(seq 30); do curl -fs http://localhost:8080/api/health && break; sleep 1; done
          curl -fs http://localhost:8080/api/demo | grep -q '"enabled":true'
          test "$(curl -fs http://localhost:8080/api/library | jq .episodes)" -gt 0
          curl -s -o /dev/null -w '%{redirect_url}' http://localhost:8080/ | grep -q /demo
      - name: Verify generated fallback release
        run: python3 scripts/verify-demo-release.py --base-url http://127.0.0.1:8080
      - name: Verify read-only approved media mount and byte ranges
        run: bash tests/smoke-prepared-demo.sh
