name: CI

on:
  # Each change is tested once, on its pull request; merging to main does not test it again.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same pull request replaces its older run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - run: dotnet test

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      # The browser download is cached per Playwright version; its system libraries are not.
      - name: Playwright version
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - run: npm run test:browser
      - name: Browser report, screenshots, traces and application logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-results
          path: |
            web/playwright-report/
            web/test-results/
          retention-days: 7

  media-preparation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: python3 -m unittest discover -s tests -p 'test_*.py'

  # The demo site's container, built the way the server builds it.
  demo-image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      # The layer cache spares the npm install, .NET publish and generated clips when their
      # inputs have not changed.
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: rabbit-ears
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: The container answers and opens on the demo page
        run: |
          docker run -d --name demo -p 8080:8080 rabbit-ears
          for i in $(seq 30); do curl -fs http://localhost:8080/api/health && break; sleep 1; done
          curl -fs http://localhost:8080/api/demo | grep -q '"enabled":true'
          test "$(curl -fs http://localhost:8080/api/library | jq .episodes)" -gt 0
          curl -s -o /dev/null -w '%{redirect_url}' http://localhost:8080/ | grep -q /demo
      - name: Verify generated fallback release
        run: python3 scripts/verify-demo-release.py --base-url http://127.0.0.1:8080
      - name: Verify read-only approved media mount and byte ranges
        run: bash tests/smoke-prepared-demo.sh
