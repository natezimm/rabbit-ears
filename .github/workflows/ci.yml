name: CI

on:
  # Pull requests are tested, and main is tested again after each merge.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same pull request replaces its older run. Runs on main always finish.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Jobs are pinned to Ubuntu 24.04 rather than ubuntu-latest, which is moving to a newer image.
# Jobs that installed ffmpeg on it intermittently hung in apt, and wheelhouse found Playwright
# could not install Chromium there. Move the pin when both are known to work on the new image.
jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - run: dotnet test

  mac-desktop:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: brew install mpv ffmpeg
      - name: Record native dependency versions
        run: |
          uname -a
          mpv --version
          ffprobe -version
      - run: dotnet test
      - run: bash scripts/publish-mac.sh osx-arm64
      - run: python3 tests/smoke-mac.py publish/mac/osx-arm64
      # Tar preserves executable bits when downloaded from Actions.
      - run: tar -czf rabbit-ears-osx-arm64.tar.gz -C publish/mac osx-arm64
      - uses: actions/upload-artifact@v7
        with:
          name: rabbit-ears-osx-arm64
          path: rabbit-ears-osx-arm64.tar.gz
          retention-days: 7

  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: |
          # The runner's apt mirror sometimes stalls; give up on a slow attempt and try again
          # rather than holding the job until its timeout.
          for attempt in 1 2 3; do
            sudo timeout 150 apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=20 update \
              && sudo timeout 240 apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=20 install -y ffmpeg \
              && exit 0
          done
          exit 1
      # The browser download is cached per Playwright version; its system libraries are not.
      - name: Playwright version
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - run: npm run test:browser
      - name: Browser report, screenshots, traces and application logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: browser-test-results
          path: |
            web/playwright-report/
            web/test-results/
          retention-days: 7

  media-preparation:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - run: |
          # The runner's apt mirror sometimes stalls; give up on a slow attempt and try again
          # rather than holding the job until its timeout.
          for attempt in 1 2 3; do
            sudo timeout 150 apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=20 update \
              && sudo timeout 240 apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=20 install -y ffmpeg \
              && exit 0
          done
          exit 1
      - run: python3 -m unittest discover -s tests -p 'test_*.py'

  # The demo site's container, built the way the server builds it.
  demo-image:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      # The layer cache spares the npm install, .NET publish and generated clips when their
      # inputs have not changed.
      - uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: rabbit-ears
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - run: |
          # The runner's apt mirror sometimes stalls; give up on a slow attempt and try again
          # rather than holding the job until its timeout.
          for attempt in 1 2 3; do
            sudo timeout 150 apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=20 update \
              && sudo timeout 240 apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=20 install -y ffmpeg \
              && exit 0
          done
          exit 1
      - name: The container answers and opens on the demo page
        run: |
          docker run -d --name demo -p 8080:8080 rabbit-ears
          for i in $(seq 30); do curl -fs http://localhost:8080/api/health && break; sleep 1; done
          curl -fs http://localhost:8080/api/demo | grep -q '"enabled":true'
          test "$(curl -fs http://localhost:8080/api/library | jq .episodes)" -gt 0
          curl -s -o /dev/null -w '%{redirect_url}' http://localhost:8080/ | grep -q /demo
      - name: Verify generated fallback release
        run: python3 scripts/verify-demo-release.py --base-url http://127.0.0.1:8080
      - name: Verify read-only approved media mount and byte ranges
        run: bash tests/smoke-prepared-demo.sh
