# The public demo site on Render's free plan. In the Render dashboard choose
# New > Blueprint and pick this repository; it builds the Dockerfile and
# redeploys on every push to main. The box at home does not use this.
services:
  - type: web
    name: rabbit-ears
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: PORT
        value: "8080"
