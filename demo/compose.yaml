# Runs the public demo site on a server that already hosts other things,
# built from this checkout. See demo/README.md.
#
#   docker compose up -d --build     build and start it; it comes back after reboots
#   git pull && docker compose up -d --build     update after a merge
services:
  rabbit-ears:
    build: ..
    image: rabbit-ears
    restart: unless-stopped
    # Only the reverse proxy talks to it. 8620 avoids other apps on the shared VM.
    ports:
      - "127.0.0.1:${RABBIT_EARS_DEMO_PORT:-8620}:8080"
    # Only nginx can reach it, and nginx sets X-Forwarded-For itself, so rate
    # limits may count visitors by that header. A container anyone can reach
    # directly must not trust it, or a visitor could claim any address.
    environment:
      Box__RateLimit__TrustForwardedFor: "true"
      # One JSON object per log line, so the server's logs can be searched by field.
      Logging__Console__FormatterName: json
      Logging__Console__FormatterOptions__UseUtcTimestamp: "true"
      # Optional: traces, metrics and logs to Grafana Cloud, from demo/.env (docs/observability.md).
      # Left empty, nothing is sent.
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_EXPORTER_OTLP_HEADERS: ${OTEL_EXPORTER_OTLP_HEADERS:-}
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_RESOURCE_ATTRIBUTES: deployment.environment.name=demo
    # Nothing is saved on the demo, so the root filesystem is read-only; the state folder
    # (Box__StateDir=/tmp/rabbitears) lives in a small tmpfs. No capabilities, no privilege gain.
    read_only: true
    tmpfs:
      - /tmp:size=64m
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    # Trial budget: verify with the staging checklist before production rollout.
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 128
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
