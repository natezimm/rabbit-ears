# The demo site behind nginx. Put it in /etc/nginx/sites-available/rabbit-ears,
# link it into sites-enabled, set server_name, then run certbot --nginx for HTTPS.
server {
    listen 80;
    server_name rabbitears.example.com;

    location / {
        proxy_pass http://127.0.0.1:8620;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Rate limits count each visitor by this. Set, never appended, so a
        # visitor cannot pass off a made-up address as their own.
        proxy_set_header X-Forwarded-For $remote_addr;

        # The TV and remote talk over a WebSocket; without these two lines
        # SignalR falls back to slower polling and channel changes lag.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 1h;

        # Video is served with range requests; pass them straight through.
        proxy_buffering off;
    }
}
