# The remote, as the Flirc sends it: a plain keyboard. The same keys the TV page
# listens for. Each one is sent to the Rabbit Ears service, which decides what
# it does; mpv itself never seeks or pauses. mpv does not auto-repeat
# script-message, so a held button is one press, one step, and cannot run the
# volume or channels away.

UP          script-message ears channel-up
PGUP        script-message ears channel-up
DOWN        script-message ears channel-down
PGDWN       script-message ears channel-down
RIGHT       script-message ears volume-up
=           script-message ears volume-up
+           script-message ears volume-up
VOLUME_UP   script-message ears volume-up
LEFT        script-message ears volume-down
-           script-message ears volume-down
VOLUME_DOWN script-message ears volume-down
m           script-message ears mute
M           script-message ears mute
MUTE        script-message ears mute
p           script-message ears power
P           script-message ears power
POWER       script-message ears power
i           script-message ears info
I           script-message ears info
l           script-message ears last-channel
L           script-message ears last-channel
BS          script-message ears last-channel
ENTER       script-message ears confirm
KP_ENTER    script-message ears confirm
SPACE       script-message ears confirm

0           script-message ears digit 0
1           script-message ears digit 1
2           script-message ears digit 2
3           script-message ears digit 3
4           script-message ears digit 4
5           script-message ears digit 5
6           script-message ears digit 6
7           script-message ears digit 7
8           script-message ears digit 8
9           script-message ears digit 9
KP0         script-message ears digit 0
KP1         script-message ears digit 1
KP2         script-message ears digit 2
KP3         script-message ears digit 3
KP4         script-message ears digit 4
KP5         script-message ears digit 5
KP6         script-message ears digit 6
KP7         script-message ears digit 7
KP8         script-message ears digit 8
KP9         script-message ears digit 9
