# mpv as the box's TV screen. kiosk.sh starts mpv with this folder as its
# config folder, so nothing in ~/.config/mpv applies. What to play, the volume,
# the green display and the tube shader all come from the Rabbit Ears service
# over the control socket.

fullscreen=yes
# Stay open with a black window between files, rather than quitting.
idle=yes
force-window=yes
title=Rabbit Ears
cursor-autohide=always
stop-screensaver=yes

# Only the keys in input.conf: the remote's, sent on to the service.
input-default-bindings=no
osc=no
load-scripts=no
ytdl=no

# The Intel graphics decode H.264 and friends; anything else falls back to the CPU.
hwdec=auto-safe
# Open the next file while the channel-change snow plays.
prefetch-playlist=yes

# Old shows, as they were: no subtitles, no album art, English audio first.
sid=no
sub-auto=no
audio-display=no
alang=en,eng
volume-max=100

# The service draws its own display; keep mpv's own messages off the picture.
osd-level=0
